<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lamput 手手按鈕</title>
<link rel="preload" as="image" href="lamput-head.png">
<meta name="description" content="一個有自己想法的開關。打開它，看看小手會怎麼辦。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='16' width='60' height='32' rx='16' fill='%23a4cd72'/%3E%3Ccircle cx='44' cy='32' r='13' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css"></head>
<body><main>
<h1>Lamput 手手按鈕</h1>
<div class="switch-grid"><section class="switch-card" style="--green:#34c759;--off:#e5e5ea" aria-label="鮮綠按鈕"><div class="stage" data-part="stage"><div class="ground"></div>
<div class="character-window"><img class="character" src="lamput-head.png" width="96" height="96" alt="" draggable="false"></div>
<svg class="snake-body" viewBox="0 0 360 265" aria-hidden="true"><path data-part="bodyMain" fill="none" stroke="#ff8900" stroke-width="12" stroke-linecap="round"/></svg>
<button class="toggle" data-part="toggle" type="button" role="switch" aria-checked="false" aria-label="鮮綠開關，讓 Lamput 出來"><span class="knob"></span></button>
<div class="hand-window" aria-hidden="true"><div class="hand" data-part="hand"><svg class="blob-hand" viewBox="0 0 180 120" aria-hidden="true"><path fill="#ff8900" d="M172 41 C150 41 139 38 119 37 C102 37 97 27 83 27 C73 27 65 34 54 34 L20 34 C7 34 7 48 20 49 L59 50 L13 55 C0 57 3 72 17 71 L63 66 L28 79 C16 84 23 98 35 92 L78 77 C96 75 108 66 120 66 L172 66Z"/></svg></div></div>
<div class="hand-window hand-front" aria-hidden="true"><div class="hand" data-part="finger"><svg class="blob-hand" viewBox="0 0 180 120" aria-hidden="true"><path fill="#ff8900" d="M172 41 C150 41 139 38 119 37 C102 37 97 27 83 27 C73 27 65 34 54 34 L20 34 C7 34 7 48 20 49 L59 50 L13 55 C0 57 3 72 17 71 L63 66 L28 79 C16 84 23 98 35 92 L78 77 C96 75 108 66 120 66 L172 66Z"/></svg></div></div>
<div class="status" aria-hidden="true"><span data-part="offLabel" class="active">OFF</span><span data-part="onLabel">ON</span></div></div>
</section><section class="switch-card" style="--green:#007aff;--off:#e5e5ea" aria-label="亮藍按鈕"><div class="stage" data-part="stage"><div class="ground"></div>
<div class="character-window"><img class="character" src="lamput-head.png" width="96" height="96" alt="" draggable="false"></div>
<svg class="snake-body" viewBox="0 0 360 265" aria-hidden="true"><path data-part="bodyMain" fill="none" stroke="#ff8900" stroke-width="12" stroke-linecap="round"/></svg>
<button class="toggle" data-part="toggle" type="button" role="switch" aria-checked="false" aria-label="亮藍開關，讓 Lamput 出來"><span class="knob"></span></button>
<div class="hand-window" aria-hidden="true"><div class="hand" data-part="hand"><svg class="blob-hand" viewBox="0 0 180 120" aria-hidden="true"><path fill="#ff8900" d="M172 41 C150 41 139 38 119 37 C102 37 97 27 83 27 C73 27 65 34 54 34 L20 34 C7 34 7 48 20 49 L59 50 L13 55 C0 57 3 72 17 71 L63 66 L28 79 C16 84 23 98 35 92 L78 77 C96 75 108 66 120 66 L172 66Z"/></svg></div></div>
<div class="hand-window hand-front" aria-hidden="true"><div class="hand" data-part="finger"><svg class="blob-hand" viewBox="0 0 180 120" aria-hidden="true"><path fill="#ff8900" d="M172 41 C150 41 139 38 119 37 C102 37 97 27 83 27 C73 27 65 34 54 34 L20 34 C7 34 7 48 20 49 L59 50 L13 55 C0 57 3 72 17 71 L63 66 L28 79 C16 84 23 98 35 92 L78 77 C96 75 108 66 120 66 L172 66Z"/></svg></div></div>
<div class="status" aria-hidden="true"><span data-part="offLabel" class="active">OFF</span><span data-part="onLabel">ON</span></div></div>
</section><section class="switch-card" style="--green:#ff2d55;--off:#e5e5ea" aria-label="桃紅按鈕"><div class="stage" data-part="stage"><div class="ground"></div>
<div class="character-window"><img class="character" src="lamput-head.png" width="96" height="96" alt="" draggable="false"></div>
<svg class="snake-body" viewBox="0 0 360 265" aria-hidden="true"><path data-part="bodyMain" fill="none" stroke="#ff8900" stroke-width="12" stroke-linecap="round"/></svg>

<div class="hand-window" aria-hidden="true"><div class="hand" data-part="hand"><svg class="blob-hand" viewBox="0 0 180 120" aria-hidden="true"><path fill="#ff8900" d="M172 41 C150 41 139 38 119 37 C102 37 97 27 83 27 C73 27 65 34 54 34 L20 34 C7 34 7 48 20 49 L59 50 L13 55 C0 57 3 72 17 71 L63 66 L28 79 C16 84 23 98 35 92 L78 77 C96 75 108 66 120 66 L172 66Z"/></svg></div></div>
<div class="hand-window hand-front" aria-hidden="true"><div class="hand" data-part="finger"><svg class="blob-hand" viewBox="0 0 180 120" aria-hidden="true"><path fill="#ff8900" d="M172 41 C150 41 139 38 119 37 C102 37 97 27 83 27 C73 27 65 34 54 34 L20 34 C7 34 7 48 20 49 L59 50 L13 55 C0 57 3 72 17 71 L63 66 L28 79 C16 84 23 98 35 92 L78 77 C96 75 108 66 120 66 L172 66Z"/></svg></div></div>

<div class="hand-window" aria-hidden="true"><div class="hand" data-part="hand"><svg class="blob-hand" viewBox="0 0 180 120" aria-hidden="true"><path fill="#ff8900" d="M172 41 C150 41 139 38 119 37 C102 37 97 27 83 27 C73 27 65 34 54 34 L20 34 C7 34 7 48 20 49 L59 50 L13 55 C0 57 3 72 17 71 L63 66 L28 79 C16 84 23 98 35 92 L78 77 C96 75 108 66 120 66 L172 66Z"/></svg></div></div>
<div class="hand-window hand-front" aria-hidden="true"><div class="hand" data-part="finger"><svg class="blob-hand" viewBox="0 0 180 120" aria-hidden="true"><path fill="#ff8900" d="M172 41 C150 41 139 38 119 37 C102 37 97 27 83 27 C73 27 65 34 54 34 L20 34 C7 34 7 48 20 49 L59 50 L13 55 C0 57 3 72 17 71 L63 66 L28 79 C16 84 23 98 35 92 L78 77 C96 75 108 66 120 66 L172 66Z"/></svg></div></div>

</section></div>
</main><script src="app.js" defer></script></body></html>
